<!DOCTYPE html>
<html>
<head>
    <title>Student Report</title>
</head>
<body>

<h1>ABC Public School</h1>

<table border="1" title="Student Marks Report">
    <tr>
        <th rowspan="2">Subject</th>
        <th colspan="2">Marks</th>
    </tr>
    <tr>
        <th>Obtained</th>
        <th>Maximum</th>
    </tr>

    <tr><td>English</td><td>85</td><td>100</td></tr>
    <tr><td>Mathematics</td><td>90</td><td>100</td></tr>
    <tr><td>Science</td><td>88</td><td>100</td></tr>
    <tr><td>Computer</td><td>95</td><td>100</td></tr>
    <tr><td>Hindi</td><td>82</td><td>100</td></tr>

    <tr>
        <td colspan="2"><b>Total</b></td>
        <td>440/500</td>
    </tr>

    <tr>
        <td colspan="2"><b>Percentage</b></td>
        <td>88%</td>
    </tr>
</table>

</body>
</html>
